#cloud-config
hostname: ${node_name}
packages:
  - curl
  - wget
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
write_files:
  - path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
      iscsi_tcp
      dm_crypt
  - path: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
  - path: /etc/security/limits.d/99-kubernetes.conf
    content: |
      *               soft    nofile          1048576
      *               hard    nofile          1048576
      root            soft    nofile          1048576
      root            hard    nofile          1048576
      *               soft    nproc           1048576
      *               hard    nproc           1048576
      root            soft    nproc           1048576
      root            hard    nproc           1048576
runcmd:
  - hostnamectl set-hostname ${node_name}
  - modprobe overlay
  - modprobe br_netfilter
  - modprobe iscsi_tcp
  - modprobe dm_crypt
  - sysctl --system
  - swapoff -a
  - sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y containerd.io
  - mkdir -p /etc/containerd
  - containerd config default | tee /etc/containerd/config.toml
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
  - sed -i 's|^\(\s*sandbox_image\s*=\s*\).*|\1"registry.k8s.io/pause:3.10"|' /etc/containerd/config.toml
  - mkdir -p /etc/containerd/certs.d
  - sed -i '/\[plugins\."io\.containerd\.grpc\.v1\.cri"\.registry\]/,/^\[/ s|config_path = ""|config_path = "/etc/containerd/certs.d"|' /etc/containerd/config.toml
  - systemctl restart containerd
  - systemctl enable containerd
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.33/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /' | tee /etc/apt/sources.list.d/kubernetes.list
  - apt-get update
  - apt-get install -y kubelet kubeadm kubectl open-iscsi nfs-common
  - apt-mark hold kubelet kubeadm kubectl
  - sudo systemctl mask multipathd.service multipathd.socket
  - sudo systemctl stop multipathd.service multipathd.socket 2>/dev/null || true
  - |
    # Get AWS instance metadata
    TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
    INSTANCE_ID=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
    PRIVATE_IP=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)
    AZ=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)
    REGION=$(echo $AZ | sed 's/[a-z]$//')
    
    # Configure kubelet for AWS
    echo "KUBELET_EXTRA_ARGS=--cloud-provider=external --provider-id=aws:///$AZ/$INSTANCE_ID --node-ip=$PRIVATE_IP" > /etc/default/kubelet
  - systemctl daemon-reload
  - systemctl enable kubelet
  - timedatectl set-timezone Asia/Kolkata
  - apt-get update && apt-get upgrade -y
